<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quick Lookup — card preview</title>
    <style>
      body { margin: 0; padding: 40px; font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
             background: #fafaf9; color: #17171c; }
      @media (prefers-color-scheme: dark) { body { background: #0e0c1c; color: #e8e6f5; } }
      #controls { display: flex; gap: 8px; margin-bottom: 32px; flex-wrap: wrap; }
      #controls button { padding: 6px 12px; border-radius: 7px; border: 1px solid #ccc; background: transparent;
                         color: inherit; cursor: pointer; font: inherit; }
      p { max-width: 60ch; }
      #anchor { background: rgba(120,120,255,.22); padding: 1px 3px; border-radius: 3px; }
    </style>
  </head>
  <body>
    <div id="controls"></div>
    <p>Placement is measured against the highlighted span, which stands in for a
      real selection: <span id="anchor">ephemeral</span> — the card must appear
      below it without covering it.</p>
    <script src="preview.js"></script>
  </body>
</html>

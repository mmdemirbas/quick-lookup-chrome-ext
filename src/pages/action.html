<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quick Lookup</title>
    <style>
      :root {
        --bg: #ffffff; --surface: #f6f6f9; --text: #17171c;
        --soft: #5c5c6b; --faint: #8b8b99; --border: #e2e2ea; --accent: #4f46e5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16161c; --surface: #1f1f28; --text: #ececf2;
          --soft: #a9a9ba; --faint: #7d7d8f; --border: #2e2e3a; --accent: #a5a0ff;
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 280px; margin: 0; padding: 14px;
        background: var(--bg); color: var(--text);
        font: 400 13.5px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      h1 { font-size: 15px; margin: 0 0 2px; }
      p { margin: 0 0 12px; color: var(--soft); font-size: 12.5px; }
      .status {
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 9px; padding: 9px 11px; font-size: 12.5px; color: var(--soft);
        margin-bottom: 12px;
      }
      .status b { color: var(--text); font-weight: 600; }
      button {
        width: 100%; background: var(--accent); color: #fff; border: 0;
        border-radius: 8px; padding: 9px 12px; font: inherit; font-weight: 600; cursor: pointer;
      }
      /* One primary action per surface. Settings is the rarer of the two and
         says so by weight rather than by being somewhere else. */
      button.secondary {
        background: none; color: var(--soft); border: 1px solid var(--border);
        font-weight: 500; margin-top: 6px;
      }
      button.secondary:hover { color: var(--text); }
      /* `hidden` is only a hint until something says so: a class that sets
         `display` beats the user-agent rule, so every `.row` the code hid
         stayed on screen. Measured: 8 elements on this page, 3 on the popup
         and 6 on the panel that `hidden` could not hide. */
      [hidden] { display: none !important; }
      .site { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
      /* The host can be long; the label must not push the select off the popup. */
      .site-label { flex: 1; min-width: 0; overflow: hidden;
                    text-overflow: ellipsis; white-space: nowrap; }
      .site label { flex: 1; font-size: 12.5px; color: var(--soft); }
      select {
        background: var(--bg); color: var(--text); border: 1px solid var(--border);
        border-radius: 7px; padding: 5px 7px; font: inherit; font-size: 12.5px;
      }
      h2 {
        font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em;
        color: var(--faint); margin: 16px 0 6px; display: flex; align-items: baseline; gap: 8px;
      }
      h2 button {
        margin-left: auto; background: none; border: 0; color: var(--faint);
        font: inherit; font-size: 11px; text-transform: none; letter-spacing: 0;
        cursor: pointer; padding: 0; width: auto;
      }
      h2 button:hover { color: var(--text); }
      ul { list-style: none; margin: 0; padding: 0; max-height: 210px; overflow-y: auto; }
      li { display: flex; align-items: baseline; gap: 7px; padding: 4px 0; }
      li .word { font-weight: 600; font-size: 13px; }
      li .gloss {
        flex: 1; color: var(--soft); font-size: 12px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      li .star {
        background: none; border: 0; cursor: pointer; padding: 0 2px;
        color: var(--faint); font-size: 12px; width: auto;
      }
      li .star.on { color: var(--accent); }
      .empty { color: var(--faint); font-size: 12.5px; padding: 4px 0; }
    </style>
  </head>
  <body>
    <h1>Quick Lookup</h1>
    <p>Select text on a page to look it up.</p>
    <div class="status" id="status" role="status" aria-live="polite">Checking…</div>
    <div class="site">
      <label for="siteMode" class="site-label">This site: <span id="siteLabel">…</span></label>
      <select id="siteMode">
        <option value="auto">Open the card</option>
        <option value="handle">Show a handle</option>
        <option value="modifier">Only with modifier</option>
        <option value="off">Do nothing</option>
      </select>
    </div>
    <h2>Recent <button id="clearHistory" type="button">Clear</button></h2>
    <ul id="history"><li class="empty">Nothing looked up yet.</li></ul>
    <button id="openPanel" type="button">Open the panel</button>
    <button id="settings" type="button" class="secondary">Open settings</button>
    <script src="action.js"></script>
  </body>
</html>

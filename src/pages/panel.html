<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quick Lookup</title>
    <style>
      :root {
        --bg: #ffffff; --surface: #f6f6f9; --text: #17171c;
        --soft: #5c5c6b; --faint: #8b8b99; --border: #e2e2ea; --accent: #4f46e5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16161c; --surface: #1f1f28; --text: #ececf2;
          --soft: #a9a9ba; --faint: #7d7d8f; --border: #2e2e3a; --accent: #a5a0ff;
        }
      }
      * { box-sizing: border-box; }
      /* The panel owns the scroll, which is why the card inside it drops its
         own height cap. Two scrollbars in one column is one too many. */
      body {
        margin: 0; padding: 0 0 16px;
        background: var(--bg); color: var(--text);
        font: 400 13.5px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #card:empty { display: none; }
      .empty-state {
        padding: 22px 16px; color: var(--soft); font-size: 12.5px;
      }
      .empty-state b { display: block; color: var(--text); font-size: 13.5px; margin-bottom: 4px; }
      h2 {
        font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em;
        color: var(--faint); margin: 18px 0 6px; padding: 0 16px;
        display: flex; align-items: baseline; gap: 8px;
      }
      h2 button {
        margin-left: auto; background: none; border: 0; color: var(--faint);
        font: inherit; font-size: 11px; text-transform: none; letter-spacing: 0;
        cursor: pointer; padding: 0;
      }
      h2 button:hover { color: var(--text); }
      ul { list-style: none; margin: 0; padding: 0 16px; }
      li { display: flex; align-items: baseline; gap: 7px; padding: 4px 0; }
      li .word {
        font-weight: 600; font-size: 13px; background: none; border: 0; padding: 0;
        color: inherit; font-family: inherit; cursor: pointer; text-align: left;
      }
      li button.word:hover { color: var(--accent); text-decoration: underline; }
      li .gloss {
        flex: 1; color: var(--soft); font-size: 12px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      li .star {
        background: none; border: 0; cursor: pointer; padding: 0 2px;
        color: var(--faint); font-size: 12px;
      }
      li .star.on { color: var(--accent); }
      .empty { color: var(--faint); font-size: 12.5px; padding: 4px 0; }
    </style>
  </head>
  <body>
    <div id="card"></div>
    <div class="empty-state" id="emptyState">
      <b>Nothing here yet.</b>
      Select text on any page. The answer appears here as well as on the page,
      and stays when you move on.
    </div>
    <h2>Recent <button id="clearHistory" type="button">Clear</button></h2>
    <ul id="history"><li class="empty">Nothing looked up yet.</li></ul>
    <script src="panel.js"></script>
  </body>
</html>

<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quick Lookup — Options</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --card: #ffffff;
        --text: #111827;
        --muted: #667085;
        --border: #e5e7eb;
        --border-2: #d1d5db;
        --primary: #6366f1;
        --primary-2: #4f46e5;
      }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      }
      .container {
        max-width: 840px;
        margin: 24px auto;
        padding: 0 16px 32px;
      }
      .page-header h1 { margin: 0 0 4px; font-size: 22px; }
      .page-header .subtitle { margin: 0 0 16px; color: var(--muted); font-size: 13px; }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        margin-bottom: 16px;
      }
      .card > h2 { margin: 0 0 12px; font-size: 16px; }
      .card > p.subtitle { margin: 0 0 12px; color: var(--muted); }

      .form-row { display: grid; grid-template-columns: 200px 1fr; gap: 6px 16px; align-items: center; margin-bottom: 12px; }
      .form-row .hint { grid-column: 2 / span 1; color: var(--muted); font-size: 12px; }
      label.label { font-weight: 600; }

      .input { width: 100%; padding: 8px 10px; border: 1px solid var(--border-2); border-radius: 8px; font-size: 14px; background: white; }
      .input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,.2); }

      .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
      .btn { border: 1px solid var(--border-2); background: #f9fafb; color: #111827; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }
      .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
      .btn.primary:hover { background: var(--primary-2); border-color: var(--primary-2); }

      .provider-list { display: flex; flex-direction: column; gap: 8px; }
      .provider-row { display: grid; grid-template-columns: 220px 1fr; gap: 8px; }

      @media (max-width: 560px) {
        .form-row { grid-template-columns: 1fr; }
        .form-row .hint { grid-column: 1 / -1; }
        .provider-row { grid-template-columns: 1fr; }
      }
    </style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./main.ts"></script>
</body>
</html>
